name: Deploy Step web app to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - 'StepWeb/**'
      - '.github/workflows/deploy-stepweb.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: StepWeb
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
